# CI action from the Github's starter workflow: CMake project running on multiple platforms.
name: Multi-platform CMake build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations.
      fail-fast: false

      # Release builds: <Linux: GCC, Clang> and <Windows: MinGW GCC>, each with and without embedded assets.
      # Debug builds: <Linux: GCC, Clang> without embedded assets, to check that Debug-only code (PIKA_DEBUG) compiles.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang]
        pika_embed_assets: ['OFF', 'ON']
        exclude:
          - os: windows-latest
            c_compiler: clang
        include:
          # Map each C compiler to its C++ compiler (added to every matching combination above)
          - c_compiler: gcc
            cpp_compiler: g++
          - c_compiler: clang
            cpp_compiler: clang++
          # Debug builds (extra combinations, so they need all keys)
          - os: ubuntu-latest
            build_type: Debug
            c_compiler: gcc
            cpp_compiler: g++
            pika_embed_assets: 'OFF'
          - os: ubuntu-latest
            build_type: Debug
            c_compiler: clang
            cpp_compiler: clang++
            pika_embed_assets: 'OFF'

    steps:
    - uses: actions/checkout@v7

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build/${{ matrix.pika_embed_assets == 'ON' && 'embedded' || 'standard' }}" >> "$GITHUB_OUTPUT"
        echo "install-dir=${{ github.workspace }}/build/${{ matrix.pika_embed_assets == 'ON' && 'embedded' || 'standard' }}/install" >> "$GITHUB_OUTPUT"
        echo "deps-dir=${{ github.workspace }}/build/_deps" >> "$GITHUB_OUTPUT"

    - name: Install SDL Dependencies (Linux/Ubuntu)
      # This step only executes when the runner OS is Linux (i.e., ubuntu-latest)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y build-essential git pkg-config cmake ninja-build \
        gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libfribidi-dev \
        libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
        libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev \
        libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
        libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev

    - name: Restore dependency sources (FetchContent)
      # SDL, SDL_mixer and SDL_ttf sources (with vendored submodules) are the same for every job of an OS.
      id: deps-cache
      uses: actions/cache@v6
      with:
        path: |
          build/_deps/*-src
          !build/_deps/**/.git
        # The key changes when vendor/CMakeLists.txt changes (e.g. a new version tag).
        # Bump the "v" number to drop old caches if the cached content changes.
        key: deps-v2-${{ runner.os }}-${{ hashFiles('vendor/CMakeLists.txt') }}

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}-${{ matrix.pika_embed_assets }}

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      # With cached dependency sources, FETCHCONTENT_FULLY_DISCONNECTED skips all git operations.
      # Precompiled headers are disabled because ccache can't cache files compiled with them (most of SDL).
      shell: bash
      run: >
        cmake -G Ninja -B '${{ steps.strings.outputs.build-output-dir }}'
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
        -DPIKA_EMBED_ASSETS=${{ matrix.pika_embed_assets }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DFETCHCONTENT_BASE_DIR='${{ steps.strings.outputs.deps-dir }}'
        ${{ steps.deps-cache.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }}
        -S '${{ github.workspace }}'

    - name: Build
      # Build your program with the given configuration.
      shell: bash
      run: cmake --build '${{ steps.strings.outputs.build-output-dir }}'

    # - name: Test
      # working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      # run: ctest --build-config ${{ matrix.build_type }}

    - name: Install non-embedded release files
      if: ${{ runner.os == 'Windows' && matrix.build_type == 'Release' && matrix.c_compiler == 'gcc' && matrix.pika_embed_assets == 'OFF' }}
      shell: bash
      run: cmake --install '${{ steps.strings.outputs.build-output-dir }}' --prefix '${{ steps.strings.outputs.install-dir }}'

    - name: Archive non-embedded release
      if: ${{ runner.os == 'Windows' && matrix.build_type == 'Release' && matrix.c_compiler == 'gcc' && matrix.pika_embed_assets == 'OFF' }}
      shell: pwsh
      run: |
        Compress-Archive -Path "${{ steps.strings.outputs.install-dir }}\*" -DestinationPath "${{ steps.strings.outputs.build-output-dir }}\pikaball-revamped-non-embedded.zip"

    - name: .exe for portable release
      uses: actions/upload-artifact@v7
      if: ${{ success() && runner.os == 'Windows' && matrix.build_type == 'Release' && matrix.c_compiler == 'gcc' && matrix.pika_embed_assets == 'ON' }}
      with:
        name: pikaball-revamped.exe
        path: '${{ steps.strings.outputs.build-output-dir }}/pikaball_revamped.exe'

    - name: .zip for non-embedded release
      uses: actions/upload-artifact@v7
      if: ${{ success() && runner.os == 'Windows' && matrix.build_type == 'Release' && matrix.c_compiler == 'gcc' && matrix.pika_embed_assets == 'OFF' }}
      with:
        name: pikaball-revamped-non-embedded.zip
        path: '${{ steps.strings.outputs.build-output-dir }}/pikaball-revamped-non-embedded.zip'
